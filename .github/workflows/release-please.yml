name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens (and keeps updating) a release PR from the conventional commits
      # on main. Merging that PR tags the release and triggers publish.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Declared to npm as part of the trusted publisher, so the OIDC token
    # this job presents carries a matching environment claim. Renaming it
    # here means renaming it in the package settings too.
    environment: npm
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for publish rights, and signs the
      # provenance attestation. Nothing publishes without it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of what
      # any current Node release bundles. Upgrading explicitly keeps this
      # working regardless of what Node 24 happens to ship with.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run build

      # No token: npm trades the job's OIDC identity for publish rights,
      # having checked it against the trusted publisher registered on the
      # package — this repository, this workflow file, this environment.
      - run: npm publish
